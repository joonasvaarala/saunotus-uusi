name: Julkaise testiympäristö (GitHub Pages)
# TESTI: SITE_ENV=test → noindex + robots Disallow koko sivustolla (myös /varaa/ ja /hallinta/). Tuotantoon tämä ei ole tarkoitettu.
# Yksi Pages-artifact: perussivusto + varauskauppa (/varaa/, /en/book/) + hallinta (/hallinta/). Rakentaa scripts/build-pages.mjs.
# Saunatietoa-artikkelit (docs/SAUNATIETOA.md): build hakee julkaistut artikkelit RPC:llä (public_list_articles / public_get_article / public_articles_sitemap, vain anon-avain, vain luku).
# Uusi/muuttunut artikkeli päätyy sivulle: repository_dispatch (articles-changed) / workflow_dispatch / tunnin ajastus (ajastettu julkaisu) → build → deploy (vain main).
# Deploy VAIN main-haarasta (push / ajastus / käsin ajettu main). Pull request ja muut haarat vain rakentavat ja tarkistavat (ei deployta).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [articles-changed, site-texts-changed] # POST /repos/{owner}/{repo}/dispatches {"event_type":"articles-changed"} (esim. botti artikkelin tallennuksen jälkeen); site-texts-changed = sivutekstit muuttuneet tietokannassa (admin_texts_import / Tekstit-näkymä, sopimus §18) → uusi build
  schedule:
    - cron: '15 * * * *' # tunneittain: ajastetut artikkelit ilmestyvät, menneet tapahtumapäivät putoavat pois
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  SITE_ENV: test
  SITE_URL: https://joonasvaarala.github.io/saunotus-uusi
  BOOKING_SUPABASE_URL: https://sxbofnuisemspgquoxyv.supabase.co
  # JULKINEN publishable-avain (frontend-avain, saa olla julkinen; oikeudet määrää RLS + funktioiden GRANTit). service_role-avainta EI koskaan tähän.
  BOOKING_ANON_KEY: sb_publishable_LZFhBH9bMAe8Q8uDI70bvQ_1cSVHCih
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sivutekstit (§18): build hakee public_get_site_texts → .cache/site-texts; haun epäonnistuessa edellisen ajon välimuisti, sitten repon content/site-texts.fallback.json (build ei kaadu; tuntematon paikkamerkki kaataa)
      - uses: actions/cache@v4
        with:
          path: .cache/site-texts
          key: site-texts-${{ github.run_id }}
          restore-keys: site-texts-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # sharp (artikkelikuvien avif/webp-versiot) on devDependency; ilman sitä build jatkuu alkuperäisillä kuvilla
      - run: npm ci
      # Saunatietoa: markdown-, lähde-/RPC-, sivupohja- ja build-tarkistustestit (fixture, ei verkkoa)
      - run: node --test tests/articles/*.test.mjs
      # Pelkkä fixture-build (testi + tuotanto): validoi JSON-LD, canonicalit, hreflangit, sitemapin, robotsin
      - run: SITE_TEXTS_FIXTURE=1 ARTICLES_FIXTURE=1 SITE_ENV=test SITE_URL=https://example.test DIST=$RUNNER_TEMP/dist-fixture-test node scripts/build.mjs
      - run: DIST=$RUNNER_TEMP/dist-fixture-test SITE_ENV=test SITE_URL=https://example.test node scripts/check-articles.mjs
      - run: SITE_TEXTS_FIXTURE=1 ARTICLES_FIXTURE=1 SITE_ENV=prod SITE_URL=https://example.test DIST=$RUNNER_TEMP/dist-fixture-prod node scripts/build.mjs
      - run: DIST=$RUNNER_TEMP/dist-fixture-prod SITE_ENV=prod SITE_URL=https://example.test node scripts/check-articles.mjs
      - run: node --test booking/supabase/functions/admin-users/logic.test.js
      - run: node --test booking/tests/mobilepay-shop.test.mjs
      # maksuvalinta kassalle/vahvistussivulle (MobilePay + lahjakortti): tekstit, tarjontapäätökset, mock-skenaario, paluuosoite
      - run: node --test booking/tests/kassa-maksu.test.mjs
      # hoitovalitsin (booking_50): kaupan/hallinnan logiikka, FI/EN-tekstit, mockit vs. sopimus
      - run: node --test booking/tests/hoitovalitsin.test.mjs
      # hallinnan päivänäkymä: päivän tuotto (käyntipäivä, brutto, perutut pois) ja tapahtumien sijoittelu
      - run: node --test booking/tests/paivanakyma-tuotto.test.mjs
      # Tarkista: sulkukonfliktin kuittaus (booking_73) ei muuta saatavuutta; tekstit ui.admin.review.*
      - run: node --test booking/tests/sulkukonflikti-kuittaus.test.mjs
      # kassan 15 min paikanpito (§17, booking_53/54): tekstit, tilat, palvelinaikalaskuri, virhekoodit, mock-moottori, migraatiot mukana
      - run: node --test booking/tests/kassa-pito.test.mjs
      # testivaihtoehto "maksu paikan päällä" (booking_57): palvelimen tarjonta, nappi, virheet FI/EN, mock, migraatio mukana
      - run: node --test booking/tests/pay-later.test.mjs
      # pakettituote Saunarituaali ja savusaunavuoro (kb 7, booking_58, §17.11): aikajana, loppuaika +2 h, la/su, mock, tuotantofixture
      - run: node --test booking/tests/saunarituaali.test.mjs
      # Sivutekstit tietokannasta (§18) + tuote 7 kentät (booking_61): paikkamerkit, build-haku/välimuisti/varateksti, p_addons, virhekoodit (fixture, ei verkkoa)
      # puhelinnumero: yksi vakio (booking/shop/src/phone.js), kielikohtainen näkyvä muoto (fi/en), tel-linkki kaikkialla samoin; ei käsin kirjoitettuja numeroita lähdekoodissa
      - run: node --test booking/tests/puhelin.test.mjs
      - run: node --test booking/tests/sivutekstit.test.mjs
      # Sivutekstit osa 3 / PR 1: kaupan sanakirjat avaimiksi, tuontitiedosto (ei ylikirjoita tuotantoa, generoitu koodista), DB-peitto + repon oletukset (ei verkkoa)
      - run: node --test booking/tests/sivutekstit-kauppa.test.mjs
      # Sivutekstit osa 3 / PR 2: staattiset sivut (etusivu, sivupohjat, kortit, alt, nav, alatunniste, SEO, Saunatietoa) avaimiksi; tuontitiedosto 2, DB-peitto, HTML tavu tavulta sama; ui.shop.error_generic
      - run: node --test booking/tests/sivutekstit-sivut.test.mjs
      # yläpalkin alarivi (SAUNOTUS + Sipoonjoen Perinnesauna): teksti tekstitaulusta ({{setting:business_name}}), varateksti, saavutettava nimi, tuontitiedosto, tyylit/kontrasti
      - run: node --test booking/tests/header-alarivi.test.mjs
      # hallinnan Vapaat ajat: tuotteet config.public_slots-kentästä (ei id-listaa), kb 7 (120 min, pakettiaikajana), mock vs. tuotannon funktio
      - run: node --test booking/tests/admin-vapaat-ajat.test.mjs
      # .cache/articles: edellinen artikkelisnapshot (RPC-katkon varalta + siirrettyjen slugien tunnistus)
      - uses: actions/cache@v4
        with:
          path: .cache/articles
          key: articles-${{ github.run_id }}
          restore-keys: articles-
      - run: node scripts/build-pages.mjs
      - run: node scripts/check-articles.mjs
      # etusivun hero: <picture>/preloadit/mitat/alt/OG + kultanapin kontrasti (staattinen tarkistus dististä)
      - run: node scripts/check-hero.mjs
      # sähköpostipohjat ovat TypeScriptiä (vain tyyppisyntaksia) → testi tarvitsee Noden tyyppien poiston (22.18+)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test booking/supabase/functions/send-emails/templates.test.mjs
      # sivutekstit osa 3 / PR 3: sähköpostien/PDF:ien/maksusivun tekstit avaimiksi (tuontitiedosto, tavu tavulta samat viestit; TypeScript-taulukot → Node 22)
      - run: node --test booking/tests/sivutekstit-funktiot.test.mjs
      # edge-funktioiden Deno-testit: PDF:t samat tavut kuin ennen tekstisiirtoa, tekstihaku (_shared/site_texts.ts), MobilePay-virhetekstit
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test -A --no-lock --node-modules-dir=none booking/supabase/functions/pdf-golden.test.ts booking/supabase/functions/_tests/site_texts_test.ts booking/supabase/functions/_tests/mobilepay_test.ts
      # lahjakoodi §13.12: kaupan ja hallinnan lunastuspyyntölogiikka (mockatut RPC:t)
      - run: node --test booking/tests/voucher-claims.test.mjs booking/tests/voucher-claims-admin.test.mjs booking/tests/lahjakoodi-vieritys.test.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
