name: Julkaise testiympäristö (GitHub Pages)
# TESTI: SITE_ENV=test → noindex + robots Disallow koko sivustolla (myös /varaa/ ja /hallinta/). Tuotantoon tämä ei ole tarkoitettu.
# Yksi Pages-artifact: perussivusto + varauskauppa (/varaa/, /en/book/) + hallinta (/hallinta/). Rakentaa scripts/build-pages.mjs.
# Saunatietoa-artikkelit (docs/SAUNATIETOA.md): build hakee julkaistut artikkelit RPC:llä (public_list_articles / public_get_article / public_articles_sitemap, vain anon-avain, vain luku).
# Uusi/muuttunut artikkeli päätyy sivulle: repository_dispatch (articles-changed) / workflow_dispatch / tunnin ajastus (ajastettu julkaisu) → build → deploy (vain main).
# Deploy VAIN main-haarasta (push / ajastus / käsin ajettu main). Pull request ja muut haarat vain rakentavat ja tarkistavat (ei deployta).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [articles-changed, site-texts-changed] # POST /repos/{owner}/{repo}/dispatches {"event_type":"articles-changed"} (esim. botti artikkelin tallennuksen jälkeen); site-texts-changed = sivutekstit muuttuneet tietokannassa (admin_texts_import / Tekstit-näkymä, sopimus §18) → uusi build
  schedule:
    - cron: '15 * * * *' # tunneittain: ajastetut artikkelit ilmestyvät, menneet tapahtumapäivät putoavat pois
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  SITE_ENV: test
  SITE_URL: https://joonasvaarala.github.io/saunotus-uusi
  BOOKING_SUPABASE_URL: https://sxbofnuisemspgquoxyv.supabase.co
  # JULKINEN publishable-avain (frontend-avain, saa olla julkinen; oikeudet määrää RLS + funktioiden GRANTit). service_role-avainta EI koskaan tähän.
  BOOKING_ANON_KEY: sb_publishable_LZFhBH9bMAe8Q8uDI70bvQ_1cSVHCih
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Varmuuskopioinnin tarkistukset: ei verkkoa, ei kantaa, ei oikeaa dumppia (db-backup.yml ei käynnisty PR:ssä).
      - run: python3 -m unittest discover -s scripts/backup -p 'test_*.py'
      - run: python3 -m unittest discover -s booking/tools/johku-sync -p 'test_*.py'
      # Sivutekstit (§18): build hakee public_get_site_texts → .cache/site-texts; haun epäonnistuessa edellisen ajon välimuisti, sitten repon content/site-texts.fallback.json (build ei kaadu; tuntematon paikkamerkki kaataa)
      - uses: actions/cache@v4
        with:
          path: .cache/site-texts
          key: site-texts-${{ github.run_id }}
          restore-keys: site-texts-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # sharp (artikkelikuvien avif/webp-versiot) on devDependency; ilman sitä build jatkuu alkuperäisillä kuvilla
      - run: npm ci
      # Saunatietoa: markdown-, lähde-/RPC-, sivupohja- ja build-tarkistustestit (fixture, ei verkkoa)
      - run: node --test tests/articles/*.test.mjs
      # Pelkkä fixture-build (testi + tuotanto): validoi JSON-LD, canonicalit, hreflangit, sitemapin, robotsin
      - run: SITE_TEXTS_FIXTURE=1 ARTICLES_FIXTURE=1 SITE_ENV=test SITE_URL=https://example.test DIST=$RUNNER_TEMP/dist-fixture-test node scripts/build.mjs
      - run: DIST=$RUNNER_TEMP/dist-fixture-test SITE_ENV=test SITE_URL=https://example.test node scripts/check-articles.mjs
      - run: SITE_TEXTS_FIXTURE=1 ARTICLES_FIXTURE=1 SITE_ENV=prod SITE_URL=https://example.test DIST=$RUNNER_TEMP/dist-fixture-prod node scripts/build.mjs
      - run: DIST=$RUNNER_TEMP/dist-fixture-prod SITE_ENV=prod SITE_URL=https://example.test node scripts/check-articles.mjs
      - run: node --test booking/supabase/functions/admin-users/logic.test.js
      - run: node --test booking/tests/mobilepay-shop.test.mjs booking/tests/vismapay-shop.test.mjs
      # maksuvalinta kassalle/vahvistussivulle (MobilePay + lahjakortti): tekstit, tarjontapäätökset, mock-skenaario, paluuosoite
      - run: node --test booking/tests/kassa-maksu.test.mjs
      # hoitovalitsin (booking_50): kaupan/hallinnan logiikka, FI/EN-tekstit, mockit vs. sopimus
      - run: node --test booking/tests/hoitovalitsin.test.mjs
      # hoito valitsematta: muistutuslinkki, varauslistan suodatin, booking_72 vain luku
      - run: node --test booking/tests/hoito-valitsematta.test.mjs
      # hallinnan päivänäkymä: päivän tuotto (käyntipäivä, brutto, perutut pois) ja tapahtumien sijoittelu
      - run: node --test booking/tests/paivanakyma-tuotto.test.mjs
      # päivänäkymä: lahjakorttivaraus tavallisen vuoron alle (normalisoitu avain), henkilömäärä, Johku- ja Lahjakortti-merkit, pending-import-32
      - run: node --test booking/tests/lahjakorttivaraus-paiva.test.mjs
      # Tarkista: sulkukonfliktin kuittaus (booking_73) ei muuta saatavuutta; tekstit ui.admin.review.*
      - run: node --test booking/tests/sulkukonflikti-kuittaus.test.mjs
      # kassan 15 min paikanpito (§17, booking_53/54): tekstit, tilat, palvelinaikalaskuri, virhekoodit, mock-moottori, migraatiot mukana
      - run: node --test booking/tests/kassa-pito.test.mjs
      # lahjakortin maksuohjaus ja varaukseton tilaus (booking_131): suora siirtymä maksuun/tilaussivulle, ei pitolaskuria ilman paikkavarausta, SQL-sopimus + rollback
      - run: node --test booking/tests/lahjakortti-maksuohjaus.test.mjs booking/tests/hold-logic.test.mjs
      # testivaihtoehto "maksu paikan päällä" (booking_57): palvelimen tarjonta, nappi, virheet FI/EN, mock, migraatio mukana
      - run: node --test booking/tests/pay-later.test.mjs
      # pakettituote Saunarituaali ja savusaunavuoro (kb 7, booking_58, §17.11): aikajana, loppuaika +2 h, la/su, mock, tuotantofixture
      - run: node --test booking/tests/saunarituaali.test.mjs
      # Sivutekstit tietokannasta (§18) + tuote 7 kentät (booking_61): paikkamerkit, build-haku/välimuisti/varateksti, p_addons, virhekoodit (fixture, ei verkkoa)
      # puhelinnumero: yksi vakio (booking/shop/src/phone.js), kielikohtainen näkyvä muoto (fi/en), tel-linkki kaikkialla samoin; ei käsin kirjoitettuja numeroita lähdekoodissa
      - run: node --test booking/tests/puhelin.test.mjs
      - run: node --test booking/tests/sivutekstit.test.mjs
      # Sivutekstit osa 3 / PR 1: kaupan sanakirjat avaimiksi, tuontitiedosto (ei ylikirjoita tuotantoa, generoitu koodista), DB-peitto + repon oletukset (ei verkkoa)
      - run: node --test booking/tests/sivutekstit-kauppa.test.mjs
      # Sivutekstit osa 3 / PR 2: staattiset sivut (etusivu, sivupohjat, kortit, alt, nav, alatunniste, SEO, Saunatietoa) avaimiksi; tuontitiedosto 2, DB-peitto, HTML tavu tavulta sama; ui.shop.error_generic
      - run: node --test booking/tests/sivutekstit-sivut.test.mjs
      # Yrityksille: yritysvuorot pois kuluttajan kalenterista, sivu FI+EN, tarjouspyynnön validointi
      - run: node --test booking/tests/yrityksille.test.mjs
      # yläpalkin alarivi (SAUNOTUS + Sipoonjoen Perinnesauna): teksti tekstitaulusta ({{setting:business_name}}), varateksti, saavutettava nimi, tuontitiedosto, tyylit/kontrasti
      - run: node --test booking/tests/header-alarivi.test.mjs
      # hallinnan Vapaat ajat: tuotteet config.public_slots-kentästä (ei id-listaa), kb 7 (120 min, pakettiaikajana), mock vs. tuotannon funktio
      - run: node --test booking/tests/admin-vapaat-ajat.test.mjs
      # Talous-myyntikäyrä (booking_71): Johku vain käyrässä, ei raportissa/CSV:ssä; tekstit FI+EN
      - run: node --test booking/tests/myyntikapyra.test.mjs
      # Hallinnan listojen suodattimet: haku näkyy, suodattimet kiinni oletuksena, painike ja aktiivisten lukumäärä
      - run: node --test booking/tests/suodattimet.test.mjs
      # Talous-tilauslista: oletuksena maksetut (booking_76), haku kaikista, tekstit FI+EN
      - run: node --test booking/tests/tilaussuodatin.test.mjs
      # Laskutus (booking_90–93): viite, OVT, invoiced-suodatin, tuontitekstit, dry_run-provider
      - run: node --test booking/tests/laskutus.test.mjs
      # .cache/articles: edellinen artikkelisnapshot (RPC-katkon varalta + siirrettyjen slugien tunnistus)
      - uses: actions/cache@v4
        with:
          path: .cache/articles
          key: articles-${{ github.run_id }}
          restore-keys: articles-
      - run: node scripts/build-pages.mjs
      - run: node scripts/check-articles.mjs
      # etusivun hero: <picture>/preloadit/mitat/alt/OG + kultanapin kontrasti (staattinen tarkistus dististä)
      - run: node scripts/check-hero.mjs
      # sähköpostipohjat ovat TypeScriptiä (vain tyyppisyntaksia) → testi tarvitsee Noden tyyppien poiston (22.18+)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test booking/supabase/functions/send-emails/templates.test.mjs
      # Tuoteviestit (booking_121): ajastus, tuontitiedosto 29, vahvistuksen ohje ja jälkimarkkinoinnin peruutus. TypeScript-mallit → Node 22.
      - run: node --test booking/tests/rich-text.test.mjs booking/tests/viestit.test.mjs
      # Viestin toimitustapa (booking_141): ajastettu lähetys tai ohjeet tilauksen yhteydessä. SQL-testi t141 ajetaan psql:llä (Bottiavustus).
      - run: node --test booking/tests/viestit-toimitustapa.test.mjs
      - run: node --test booking/supabase/functions/send-emails/mailer.test.mjs
      # sivutekstit osa 3 / PR 3: sähköpostien/PDF:ien/maksusivun tekstit avaimiksi (tuontitiedosto, tavu tavulta samat viestit; TypeScript-taulukot → Node 22)
      - run: node --test booking/tests/sivutekstit-funktiot.test.mjs
      # edge-funktioiden Deno-testit: PDF:t samat tavut kuin ennen tekstisiirtoa, tekstihaku (_shared/site_texts.ts), MobilePay-virhetekstit
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test -A --no-lock --node-modules-dir=none booking/supabase/functions/pdf-golden.test.ts booking/supabase/functions/_tests/site_texts_test.ts booking/supabase/functions/_tests/mobilepay_test.ts booking/supabase/functions/_tests/procountor_test.ts booking/supabase/functions/_tests/vismapay_test.ts booking/supabase/functions/_tests/service_role_auth_test.ts booking/supabase/functions/_tests/booking_calendar_sync_test.ts booking/supabase/functions/_tests/johku_sync_test.ts booking/supabase/functions/shift-offer-engine/core_test.ts booking/supabase/functions/shift-offer-engine/whatsapp_test.ts booking/supabase/functions/shift-offer-engine/inbound_test.ts booking/supabase/functions/shift-offer-engine/api_test.ts booking/vuoro/vuoro_test.ts
      # Vuorotarjousmoottorin Deno-ydin (core_test.ts), WhatsApp-sovitin (whatsapp_test.ts),
      # saapuvien viestien itsepalvelu (inbound_test.ts),
      # JSON-rajapinta (api_test.ts) ja staattinen vastaussivu (vuoro_test.ts) ajetaan yllä.
      # pgTAP booking/supabase/tests/124_shift_offer_engine.test.sql,
      # booking/supabase/tests/125_whatsapp_inbound.test.sql ja
      # booking/supabase/tests/shift_offer_race.sh EIVÄT ole tässä työnkulussa:
      # Pages-ajossa ei ole Postgresia, ja booking/supabase/tests/run.sh pysähtyy
      # migraatioon booking_39 (tuotannon tilaussummat 203/13). Ne ajetaan paikallisesti psql:llä.
      - run: node --test booking/tests/procountor-admin.test.mjs booking/tests/pikakassa.test.mjs booking/tests/pikakassa-nakyma.test.mjs
      # QR-tuote, tulostus ja asetusten välilehdet (booking_104–105).
      # t104 (booking/supabase/tests/pos/t104_product_qr.sql) ei ole tässä ajossa:
      # työnkulussa ei ole Postgresia, ja booking/supabase/tests/run.sh ajaa vain juuren [0-9]*.test.sql.
      # Bottiavustus ajaa t104:n psql:llä migraatioiden jälkeen.
      # t110 (booking/supabase/tests/pos/t110_pos_link_email.sql) ei ole tässä ajossa:
      # työnkulussa ei ole Postgresia. Bottiavustus ajaa t110:n psql:llä migraatioiden jälkeen.
      # t111 (booking/supabase/tests/products/t111_admin_product_create.sql) ei ole tässä ajossa:
      # työnkulussa ei ole Postgresia. Bottiavustus ajaa t111:n psql:llä migraatioiden jälkeen.
      # t114 (booking/supabase/tests/calendar/t114_booking_calendar.sql) ei ole tässä ajossa:
      # työnkulussa ei ole Postgresia. Bottiavustus ajaa t114:n samassa transaktiossa kuin
      # booking_114-migraation, kun booking.skip_cron = on, ja kumoaa kaiken.
      - run: node --test booking/tests/varauskalenteri.test.mjs
      - run: node --test booking/tests/qr-asetukset.test.mjs booking/tests/tuote-luonti.test.mjs
      # t123 (booking/supabase/tests/talous/t123_settings_ui.sql) ei ole tässä ajossa:
      # työnkulussa ei ole Postgresia. Bottiavustus ajaa t123:n psql:llä migraatioiden jälkeen.
      - run: node --test booking/tests/asetukset.test.mjs
      # lahjakoodi §13.12: kaupan ja hallinnan lunastuspyyntölogiikka (mockatut RPC:t)
      - run: node --test booking/tests/voucher-claims.test.mjs booking/tests/voucher-claims-admin.test.mjs booking/tests/lahjakoodi-vieritys.test.mjs
      # jonotuslista (booking_132): kaupan näkymä, tekstit, sähköpostipohja ja migraation rakenne.
      # t132 (booking/supabase/tests/waitlist/t132_waitlist.sql) ei ole tässä ajossa: työnkulussa ei ole Postgresia.
      # Bottiavustus ajaa t132:n psql:llä migraatioiden ja fixtures/10_test_helpers.sql:n jälkeen.
      - run: node --test booking/tests/jonotuslista.test.mjs
      # booking_134: jonotuslistan henkilömäärä 1–6, mahtuvuuteen perustuva jako ja lunastus.
      # t134 (booking/supabase/tests/waitlist/t134_waitlist_party_size.sql) ajetaan paikallisessa PG17:ssä t132:n tapaan.
      - run: node --test booking/tests/jonotuslista-henkilomaara.test.mjs
      # booking_135: voimassa olevat jonoilmoitukset vähennetään vapaista paikoista myös seuraavissa ajoissa (sama vuoro + jaettu kapasiteettipooli),
      # tarjouksen voimassaolo (waitlist_offer_minutes) ja lunastuksen rate limit vain tunnetulle tokenille; migraatio + rollback olemassa.
      # t135 (booking/supabase/tests/waitlist/t135_waitlist_notified_capacity.sql) ajetaan paikallisessa PG17:ssä t132:n ja t134:n tapaan.
      - run: node --test booking/tests/jonotuslista-ilmoitetut-paikat.test.mjs
      # booking_137: vuoroon ≥ 48 h → ensimmäinen mahtuva saa ilmoituksen ja 120 min pidon (vanhentunut → offer_expired, oma kauppateksti
      # pending-import-39); alle 48 h → ei pitoa, ilmoitus kaikille mahtuville. Asetukset waitlist_offer_minutes ja waitlist_hold_min_hours_before.
      # t137 (booking/supabase/tests/waitlist/t137_waitlist_offer_window.sql) ajetaan paikallisessa PG17:ssä t135:n tapaan.
      - run: node --test booking/tests/jonotuslista-tarjousaika.test.mjs
      # booking_139: vuoroon ≥ 48 h vain yksi pito per vuoro kerrallaan (ensimmäinen mahtuva, 120 min); vanhentunut pito → ei uutta pitoa,
      # pg_cron booking_waitlist_sweep (minuutin välein) ilmoittaa kaikille mahtuville; vanhentuneen pidon haltija varaa normaalisti (hold_expired).
      # Uusi vapautuminen = vapaa kapasiteetti > waitlist_session_state.offered_free → yksi pito ensimmäiselle, jolla ei ole ollut pitoa.
      # t139 (booking/supabase/tests/waitlist/t139_waitlist_single_hold.sql) ajetaan paikallisessa PG17:ssä t137:n tapaan.
      # Pidon aikana paikka ei ole julkisessa myynnissä (_pool_peak vähentää voimassa olevat pidot; haltija, henkilökunta ja service_role ohittavat):
      # t139_waitlist_hold_off_sale.sql samassa paikallisessa ajossa.
      - run: node --test booking/tests/jonotuslista-yksi-pito.test.mjs
      # booking_148: jonotuslistan henkilömäärä palvelutyypin mukaan (schedule_rules.mode = 'exclusive' → yksityisvuoro, ei henkilömäärää;
      # kb.products.category = 'event' → tapahtuma, 1..kapasiteetti; muuten yleinen vuoro 1–6). 48 h -sääntö ja 120 min pito ennallaan.
      # Tekstit content/site-texts.pending-import-48.json. t148 (booking/supabase/tests/waitlist/t148_waitlist_party_size_by_type.sql)
      # ajetaan paikallisessa PG17:ssä t139:n tapaan (työnkulussa ei ole Postgresia).
      - run: node --test booking/tests/jonotuslista-ryhmakoko-tyyppi.test.mjs
      # booking_133: päivänippu + kuukauden saatavuus yhdellä RPC:llä (SQL-vertailu booking_125:een: booking/tests/paiva-ja-saatavuus-nopeutus-regressio.sql, ajetaan testikannassa)
      - run: node --test booking/tests/paiva-ja-saatavuus-nopeutus.test.mjs
      # Paketti 05 / booking_138: hallinnan päänavigaatio (Tilaukset + Varaukset-välilehti, vanhat #/varaukset-linkit), yläpalkin pikahaku ja
      # käyttäjävalikko, mobiilin 54 px ikonisivupalkki, varauslistan palvelinpuolinen lajittelu (p_sort) ja suora linkki (p_reservation_id),
      # tekstit ui.admin.nav.* (content/site-texts.pending-import-38.json); migraatio + rollback olemassa.
      # t138 (booking/supabase/tests/hallinta/t138_reservations_nav.sql) ajetaan paikallisessa PG17:ssä t135:n tapaan (työnkulussa ei ole Postgresia).
      # Selaintesti booking/scripts/e2e-hallinta-nav.mjs (390 px ja työpöytä, mock-tila) vaatii Chromen, ajetaan paikallisesti.
      - run: node --test booking/tests/hallinta-nav-ylapalkki.test.mjs
      # booking_136: hallinnan hyvitys ↔ peruutus (oletus Ei, oikeudet payments.refund / bookings.manage, tekstit pending-import-37, migraation ja rollbackin rakenne).
      # t136 (booking/supabase/tests/talous/t136_refund_cancel.sql) ajetaan testikannassa psql:llä migraatioiden ja fixtures/10_test_helpers.sql:n jälkeen.
      - run: node --test booking/tests/hyvitys-peruutus.test.mjs
      # Paketti 04 / booking_140: päivän työvuororajaus (perusrooli näkee päivän vuorot vain omina työpäivinään), Seuraava oma vuoro,
      # varauksen muistiinpano (bookings.manage), päivän muistiinpanot ja ajastetut henkilöstötiedotteet, notes_bundle päivänipussa,
      # tekstit ui.admin.day_memos.* (content/site-texts.pending-import-41.json); migraatio + rollback olemassa.
      # t140 (booking/supabase/tests/day/t140_day_notes_bulletins.sql) ajetaan paikallisessa PG17:ssä t138:n tapaan (työnkulussa ei ole Postgresia).
      - run: node --test booking/tests/paiva-muistiinpanot.test.mjs
      # Paketti 07: yhdenmukainen siirtymävieritys (kauppa, lahjakortit, tilaussivu, hallinnan uusi varaus / resurssivaraus):
      # yhteiset apurit revealForm/revealSection (block start, reduced-motion → auto, fokus preventScroll) ja revealIfHidden (vain jos ei näkyvissä),
      # scroll-margin-top 84 px kiinteän yläpalkin alle. Ei migraatiota eikä tekstejä.
      - run: node --test booking/tests/sivuston-vieritys.test.mjs
      # Paketti 10 / booking_142: alennus- ja vuosikorttikoodit kassalla, vuosikortin verkko-osto (oletuksena pois), hallinnan Alennuskoodit-näkymä.
      # t142 (booking/supabase/tests/discounts/t142_annual_cards_discount_codes.sql) ajetaan paikallisessa PG17:ssä t140:n tapaan (työnkulussa ei ole Postgresia).
      - run: node --test booking/tests/vuosikortit-alennuskoodit.test.mjs
      # Paketti 10 jatko / booking_143: 10 merkin satunnainen vuosikorttikoodi, rate limit ilman IP:tä, vuosikorttivarauksen alennus, peruutus palauttaa koodin käytön.
      # t143 (booking/supabase/tests/discounts/t143_annual_code_hardening.sql) ajetaan paikallisessa PG17:ssä t142:n tapaan (työnkulussa ei ole Postgresia).
      - run: node --test booking/tests/vuosikortti-koodi-kovennus.test.mjs
      # Lahjakorttilista (booking_145): haku myös tuotteella, aakkosjärjestys, 20 kerrallaan, Johku-kortit samassa listassa. SQL-testi t145 ajetaan paikallisessa PG17:ssä.
      - run: node --test booking/tests/lahjakorttilista.test.mjs
      - run: node --test booking/tests/giftcards.test.mjs
      # Paketti 11 / booking_144: Schema.org-lisäykset, vanhojen osoitteiden noindex-ohjaukset, evästeetön kävijämittaus (OLETUKSENA POIS, ei testisivulla), hallinnan Kävijät-välilehti.
      # SQL: booking/supabase/tests/analytics/t144_cookieless_analytics.sql ajetaan paikallisessa PG17:ssä (koko ketju + rollback + uudelleenajo).
      - run: node --test booking/tests/seo-ja-kavijatilastot.test.mjs
      # booking_149: asiakkaan peruutuspyyntö (ja sen kautta hyvitys) vain, jos vuoron alkuun on vähintään customer_change_hours_before (48) h;
      # palvelin pakottaa (cancel_too_late), tilaussivu piilottaa lomakkeen ja näyttää puhelinnumeron; hallinnan peruutus/hyvitys aina. Tekstit pending-import-49.
      # t149 (booking/supabase/tests/peruutus/t149_customer_cancel_48h.sql) ajetaan paikallisessa PG17:ssä t143:n tapaan (työnkulussa ei ole Postgresia).
      - run: node --test booking/tests/peruutusraja-48h.test.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
