# Supabase-projektin asetukset, joita CLI (supabase functions deploy) käyttää. Salaisuuksia EI tallenneta tähän.
[functions.admin-users]
verify_jwt = true   # pyynnöllä pitää olla kirjautuneen käyttäjän JWT; admin-oikeus tarkistetaan lisäksi funktiossa (booking.is_admin)

# Talous-integraatiot (vastaa tuotannon verify_jwt-asetuksia 17.10.2026). Salaisuudet (RESEND_API_KEY, VISMAPAY_*, PROCOUNTOR_*) vain Edge-salaisuuksina, ei tähän.
[functions.send-emails]
verify_jwt = false   # pg_cron kutsuu; tunnistus x-sync-secret (booking._cron_secret_ok)
[functions.receipt-pdf]
verify_jwt = false   # kuitin public_token on salaisuus; kuitti on muuttumaton snapshot
[functions.invoice-pdf]
verify_jwt = false   # laskun public_token on salaisuus; numeroitu lasku välimuistissa
[functions.invoice-dispatch]
verify_jwt = false   # pg_cron kutsuu; tunnistus x-sync-secret (booking._cron_secret_ok)
[functions.gift-card-pdf]
verify_jwt = false   # kortin public_token (UUID) on salaisuus; maksamaton/mitätöity kortti → 409; ei välimuistia
[functions.report-pdf]
verify_jwt = true
[functions.vismapay-start]
verify_jwt = false   # asiakas tulee maksulinkistä (RUNKO, 501)
[functions.vismapay-notify]
verify_jwt = false   # Visma Payn palvelinkutsu (RUNKO, allekirjoitus tarkistetaan funktiossa)
[functions.vismapay-refund]
verify_jwt = true
# Vipps MobilePay ePayment (suora integraatio). Salaisuudet: MOBILEPAY_CLIENT_ID, MOBILEPAY_CLIENT_SECRET, MOBILEPAY_SUBSCRIPTION_KEY, MOBILEPAY_MSN, MOBILEPAY_WEBHOOK_SECRET (vain Edge-salaisuuksina). Kytkin: integration_config 'mobilepay' (off/test/live).
[functions.mobilepay-start]
verify_jwt = false   # asiakas tilaussivulta/maksulinkistä; tunnistus: tilauksen public_token / linkin token (RPC tarkistaa)
[functions.mobilepay-notify]
verify_jwt = false   # Vippsin webhook (HMAC-allekirjoitus tarkistetaan funktiossa) + tilaussivun reconcile (order_token)
[functions.mobilepay-refund]
verify_jwt = true    # henkilökunta (payments.refund tarkistetaan funktiossa) tai service role

[functions.procountor-sync]
verify_jwt = false   # pg_cron kutsuu; tunnistus x-sync-secret (booking._cron_secret_ok). Ei JWT:tä.

# Varauskalenterin vienti (booking_114). Samat salaisuudet kuin booking-closure-sync: GOOGLE_SERVICE_ACCOUNT_JSON, SYNC_CRON_SECRET. Ei uusia salaisuuksia tähän.
[functions.booking-calendar-sync]
verify_jwt = false   # pg_cron kutsuu; tunnistus x-sync-secret. Ei JWT:tä. Oletustila off ei kirjoita kalenteriin.
