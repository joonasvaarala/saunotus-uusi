<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2B3A30">
<title>Varausjärjestelmä – hallinta</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="calendar.css">
</head>
<body>
<div id="app">
  <section id="login-screen" hidden>
    <form id="login" class="card login" novalidate>
      <h1>Hallinta</h1>
      <p class="muted">Sipoonjoen Perinnesauna – varausjärjestelmä</p>
      <label class="fld"><span>Sähköposti</span><input id="email" type="email" autocomplete="username" required></label>
      <label class="fld"><span>Salasana</span><input id="password" type="password" autocomplete="current-password" required></label>
      <p id="login-err" class="err" role="alert" hidden></p>
      <button class="btn primary" type="submit">Kirjaudu</button>
    </form>
  </section>
  <section id="setpw-screen" hidden>
    <form id="setpw" class="card login" novalidate>
      <h1>Aseta salasana</h1>
      <p class="muted">Tervetuloa! Valitse salasana (vähintään 8 merkkiä), jolla kirjaudut jatkossa.</p>
      <label class="fld"><span>Uusi salasana</span><input id="pw1" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="fld"><span>Salasana uudelleen</span><input id="pw2" type="password" autocomplete="new-password" minlength="8" required></label>
      <p id="setpw-err" class="err" role="alert" hidden></p>
      <button class="btn primary" type="submit">Tallenna ja jatka</button>
    </form>
  </section>
  <div id="shell" hidden>
    <header class="top">
      <a class="brand" href="#/"><img src="logo-haalea.svg" alt="Sauna hallinta" width="26" height="36"></a>
      <div id="quick-search" class="quick-search">
        <button id="quick-search-toggle" class="btn ghost quick-search-toggle" type="button" aria-label="Avaa pikahaku" aria-expanded="false" aria-controls="quick-search-box"><span data-icon="search" aria-hidden="true"></span></button>
        <div id="quick-search-box" class="quick-search-box">
          <label for="quick-search-input" class="sr">Pikahaku</label>
          <input id="quick-search-input" type="search" placeholder="Hae nimeä, numeroa tai koodia" autocomplete="off" aria-label="Pikahaku">
          <div id="quick-search-results" class="quick-search-results" role="region" aria-label="Pikahaun tulokset" hidden></div>
        </div>
      </div>
      <a class="btn ghost quick-action" id="quick-new" href="#/uusi" aria-label="Uusi varaus"><span data-icon="add" aria-hidden="true"></span><span class="action-label">Uusi varaus</span></a>
      <a class="btn ghost quick-action" id="quick-review" href="#/tarkista" aria-label="Tarkista"><span data-icon="tick" aria-hidden="true"></span><span class="action-label">Tarkista</span></a>
      <div class="user-menu">
        <span id="who" class="who" role="status"></span>
        <button id="user-menu-toggle" type="button" class="btn ghost user-toggle" aria-expanded="false" aria-controls="user-dropdown" aria-label="Käyttäjävalikko">
          <span id="user-short">Käyttäjä</span><span id="user-initial" aria-hidden="true">K</span><small id="user-role"></small><span data-icon="chev" aria-hidden="true"></span>
        </button>
        <div id="user-dropdown" class="user-dropdown" hidden>
          <p id="user-email"></p><p id="user-role-full"></p>
          <a id="open-shop" href="../varaa/" target="_blank" rel="noopener noreferrer"><span id="open-shop-label">Avaa kauppa</span> <span data-icon="external" aria-hidden="true"></span><span id="open-shop-hint" class="sr">(avautuu uuteen välilehteen)</span></a>
          <button id="logout" class="btn ghost sm" type="button">Kirjaudu ulos</button>
        </div>
      </div>
    </header>
    <div id="nav-rail" class="nav-rail">
      <nav id="nav" class="nav" aria-label="Päävalikko"></nav>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Laajenna valikko" aria-expanded="false" aria-controls="nav"><span data-icon="pgnext" aria-hidden="true"></span></button>
    </div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<script src="config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
